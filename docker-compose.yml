version: "3.9"

services:
  olx-bot:
    build: .
    container_name: olx_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Europe/Kyiv
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
